name: ls-erp-local-storage
services:
  metadata:
    image: pgvector/pgvector:pg17
    container_name: ls-erp-local-storage-db
    labels:
      com.leiwissen.purpose: local-demo-storage
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${LOCAL_STORAGE_PASSWORD:?Run npm run local:storage first}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: supabase/storage-api:v1.81.0
    container_name: ls-erp-local-storage-api
    labels:
      com.leiwissen.purpose: local-demo-storage
    depends_on:
      metadata:
        condition: service_healthy
    environment:
      SERVER_PORT: 5000
      AUTH_JWT_SECRET: ${LOCAL_STORAGE_JWT_SECRET}
      ANON_KEY: ${LOCAL_STORAGE_ANON_KEY}
      SERVICE_KEY: ${LOCAL_STORAGE_SERVICE_KEY}
      DATABASE_URL: postgres://postgres:${LOCAL_STORAGE_PASSWORD}@metadata:5432/postgres
      DB_INSTALL_ROLES: "true"
      DATABASE_POOL_MAX: "5"
      STORAGE_BACKEND: file
      STORAGE_FILE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: local-demo
      TENANT_ID: local-demo
      REGION: local
      FILE_SIZE_LIMIT: "10485760"
      IMAGE_TRANSFORMATION_ENABLED: "false"
      S3_PROTOCOL_ENABLED: "false"
      VECTOR_ENABLED: "false"
      ICEBERG_ENABLED: "false"
      STORAGE_PUBLIC_URL: http://127.0.0.1:55446
      LOG_LEVEL: error
    volumes:
      - files:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/status"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
  gateway:
    image: nginx:1.28-alpine
    container_name: ls-erp-local-storage-gateway
    labels:
      com.leiwissen.purpose: local-demo-storage
    depends_on:
      storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:55446:80"
    volumes:
      - ./scripts/local-storage-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/storage/v1/status"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  metadata:
  files:
