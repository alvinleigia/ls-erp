server {
  listen 80;
  server_name _;
  # Leave room for multipart headers; bucket limits apply to the file itself.
  client_max_body_size 12m;
  access_log off;
  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 30s;
  }
  location / { return 404; }
}
