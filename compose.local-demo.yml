name: ls-erp-local-demo
services:
  postgres:
    image: postgres:17-alpine
    container_name: ls-erp-local-demo-db
    labels:
      com.leiwissen.purpose: local-demo
    environment:
      POSTGRES_DB: ls_salon_crm_test
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run npm run local:setup first}
    ports:
      - "127.0.0.1:55445:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ls_salon_crm_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  demo-data:
